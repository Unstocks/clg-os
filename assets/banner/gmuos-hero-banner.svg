<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Subtle CRT Scanlines -->
  <g opacity="0.04">
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#FFF" stroke-width="1" />
    <line x1="0" y1="390" x2="1200" y2="390" stroke="#FFF" stroke-width="1" />
  </g>

  <!-- Terminal Window Header -->
  <rect x="30" y="30" width="1140" height="36" rx="8" fill="#1E293B" opacity="0.6" />
  <circle cx="56" cy="48" r="6" fill="#EF4444" />
  <circle cx="76" cy="48" r="6" fill="#F59E0B" />
  <circle cx="96" cy="48" r="6" fill="#10B981" />
  <text x="600" y="53" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#94A3B8" letter-spacing="1.5">GMU OS 0.1 :: 16-BIT REAL-MODE X86 ENVIRONMENT</text>

  <!-- Hero Title Section -->
  <g transform="translate(60, 95)">
    <!-- Terminal Prompt Prefix -->
    <text x="0" y="45" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="28" font-weight="700" fill="#10B981">&gt;</text>
    <text x="25" y="45" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="1">GMU OS</text>
    <rect x="180" y="16" width="60" height="28" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1.5" />
    <text x="210" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#60A5FA">0.1</text>

    <!-- Subtitle -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#E2E8F0">
      A 16-Bit C-Oriented Learning Operating System
    </text>

    <!-- Value Proposition Monospace Tagline -->
    <text x="0" y="125" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="15" fill="#94A3B8">
      Assembly-powered kernel  •  Freestanding C applications  •  Real-mode x86  •  FAT12 filesystem
    </text>

    <!-- Badge Pills Row -->
    <g transform="translate(0, 160)">
      <!-- Badge 1: Real Mode -->
      <g transform="translate(0, 0)">
        <rect width="160" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#34D399" />
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">x86 Real Mode</text>
      </g>

      <!-- Badge 2: Assembly + C -->
      <g transform="translate(172, 0)">
        <rect width="180" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#60A5FA" />
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">NASM + GCC -m16</text>
      </g>

      <!-- Badge 3: FAT12 -->
      <g transform="translate(364, 0)">
        <rect width="150" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#FBBF24" />
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">FAT12 Floppy</text>
      </g>

      <!-- Badge 4: QEMU Tested -->
      <g transform="translate(526, 0)">
        <rect width="160" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#A78BFA" />
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">QEMU Verified</text>
      </g>
    </g>
  </g>

  <!-- Retro Computer Terminal Preview Box (Right Side) -->
  <g transform="translate(820, 105)">
    <rect width="330" height="255" rx="10" fill="#030712" stroke="#1F2937" stroke-width="2" />
    <rect x="0" y="0" width="330" height="24" rx="8" fill="#111827" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B7280">bootloader :: 0x07C0:0000</text>
    
    <!-- Terminal Output -->
    <g transform="translate(16, 44)" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#10B981">
      <text x="0" y="0">GMU OS 0.1 (Based on MikeOS)</text>
      <text x="0" y="18" fill="#94A3B8">Kernel Load: 0x20000 (16-bit)</text>
      <text x="0" y="36" fill="#60A5FA">GMUOS&gt; HELP</text>
      <text x="0" y="54" fill="#E2E8F0">  Files:  DIR, LS, CAT, COPY</text>
      <text x="0" y="72" fill="#E2E8F0">  System: CLS, HELP, ABOUT, VER</text>
      <text x="0" y="90" fill="#60A5FA">GMUOS&gt; DIR</text>
      <text x="0" y="108" fill="#FBBF24">  KERNEL.BIN       21149 B</text>
      <text x="0" y="126" fill="#FBBF24">  SCICALC.BIN       3890 B</text>
      <text x="0" y="144" fill="#FBBF24">  GRADES2.BIN       2410 B</text>
      <text x="0" y="162" fill="#60A5FA">GMUOS&gt; _</text>
      <rect x="56" y="152" width="7" height="13" fill="#10B981" opacity="0.8" />
    </g>
  </g>

  <!-- Bottom Academic & Upstream Attribution Bar -->
  <g transform="translate(60, 375)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">
      Project-Based Learning • Course UE25CS2304 • GM University • Upstream Foundation: MikeOS 4.7.0
    </text>
  </g>
</svg>

